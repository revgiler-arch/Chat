name: Deploy push server

# Выкладывает сервер уведомлений (папка worker/) на Cloudflare Workers.
# Нужны секреты репозитория: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, FIREBASE_SERVICE_ACCOUNT.
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-push.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      TURN_KEY_ID: ${{ secrets.TURN_KEY_ID }}
      TURN_KEY_API_TOKEN: ${{ secrets.TURN_KEY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check secrets
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$SA" ] && missing="$missing FIREBASE_SERVICE_ACCOUNT"
          if [ -n "$missing" ]; then echo "::error::Нет секретов:$missing"; exit 1; fi
          echo "$SA" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('private_key') and d.get('client_email'); print('service account ok:', d['client_email'])"
      - name: Prepare file storage
        run: |
          npx --yes wrangler@3 r2 bucket create chat-files || echo "Bucket already exists"
          npx --yes wrangler@3 r2 bucket lifecycle list chat-files | grep -q expire-90d \
            || npx --yes wrangler@3 r2 bucket lifecycle add chat-files expire-90d --expire-days 90 --force
      - name: Deploy
        run: |
          npx --yes wrangler@3 deploy 2>&1 | tee /tmp/deploy.txt
          url=$(grep -o 'https://[a-z0-9.-]*\.workers\.dev' /tmp/deploy.txt | head -1)
          echo "Адрес сервера: $url"
          echo "PUSH_URL=$url" >> "$GITHUB_ENV"
      - name: Upload secrets
        run: |
          printf '%s' "$SA" | npx --yes wrangler@3 secret put SERVICE_ACCOUNT
          # TURN — по желанию: без него звонки идут только напрямую (через STUN)
          if [ -n "$TURN_KEY_ID" ] && [ -n "$TURN_KEY_API_TOKEN" ]; then
            printf '%s' "$TURN_KEY_ID" | npx --yes wrangler@3 secret put TURN_KEY_ID
            printf '%s' "$TURN_KEY_API_TOKEN" | npx --yes wrangler@3 secret put TURN_KEY_API_TOKEN
          fi
      # Адрес сервера записываем в репозиторий — сборка приложения возьмёт его оттуда
      - name: Save server address
        working-directory: .
        run: |
          [ -z "$PUSH_URL" ] && { echo "::warning::Не удалось узнать адрес сервера"; exit 0; }
          if [ "$(cat push-url.txt 2>/dev/null)" != "$PUSH_URL" ]; then
            echo "$PUSH_URL" > push-url.txt
            git config user.name "chat-bot"
            git config user.email "chat-bot@users.noreply.github.com"
            git add push-url.txt
            git commit -m "Адрес сервера уведомлений: $PUSH_URL"
            git push origin HEAD:main
          fi
